services:
  database:
    image: postgres:15.3-alpine
    container_name: ordermesh-database
    restart: unless-stopped
    # Compose only auto-loads `.env`; point it at the file the app actually uses.
    env_file:
      - .env.development
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - "5432:5432"
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ordermesh-api
    restart: unless-stopped
    profiles: ["full"]
    env_file:
      - .env.development
    environment:
      # Reach the database by service name, not localhost, inside the network.
      DB_HOST: database
      HOST: 0.0.0.0
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:'+(process.env.PORT||3001)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  database-data:
